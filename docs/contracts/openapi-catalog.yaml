openapi: 3.1.0
info:
  title: Shelfwise Catalog API
  version: 1.0.0
  description: >-
    Product batches with expiry dates and stock reservations.
    Upstream supplier for Ordering (Customer–Supplier on the Context Map).
    Compatible changes stay in /api/v1; breaking changes go to /api/v2 (expand–contract).

servers:
  - url: http://localhost:5012
    description: Local
  - url: http://shelfwise-catalog-api:8080
    description: Docker Compose network

tags:
  - name: Batches

paths:
  /api/v1/batches:
    post:
      tags: [Batches]
      operationId: registerBatch
      summary: Register product batch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBatchRequest'
            examples:
              milk:
                value:
                  productId: "11111111-1111-1111-1111-111111111111"
                  quantity: 50
                  expiryDate: "2026-12-31"
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDto'
              examples:
                created:
                  $ref: '#/components/examples/ActiveBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Batches]
      operationId: listBatches
      summary: List batches ordered by expiry date
      parameters:
        - name: productId
          in: query
          required: false
          description: Return only batches of this product (earliest expiry first).
          schema:
            type: string
            format: uuid
          example: "11111111-1111-1111-1111-111111111111"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchDto'
              examples:
                list:
                  value:
                    - batchId: "5bf1405b-5ab3-4aa1-ae90-25dd58ab4964"
                      productId: "11111111-1111-1111-1111-111111111111"
                      expiryDate: "2026-12-31"
                      status: Active
                      deliveredQuantity: 50
                      reservedQuantity: 0
                      availableQuantity: 50
                      reservations: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/batches/{batchId}:
    parameters:
      - $ref: '#/components/parameters/BatchIdPath'
    get:
      tags: [Batches]
      operationId: getBatch
      summary: Get batch by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDto'
              examples:
                batch:
                  $ref: '#/components/examples/ActiveBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Batches]
      operationId: deleteBatch
      summary: Delete batch
      description: Only a batch without reservations can be deleted.
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Batch has reservations
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                hasReservations:
                  value:
                    type: "https://shelfwise.local/errors/batch.has_reservations"
                    title: Batch has reservations
                    status: 422
                    errorCode: batch.has_reservations
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/batches/{batchId}/reservations:
    parameters:
      - $ref: '#/components/parameters/BatchIdPath'
    post:
      tags: [Batches]
      operationId: reserveStock
      summary: Reserve batch stock
      description: Repeated reservations for the same order are added to one reservation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveStockRequest'
            examples:
              four:
                value:
                  orderId: "66666666-6666-6666-6666-666666666666"
                  quantity: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDto'
              examples:
                reserved:
                  value:
                    batchId: "5bf1405b-5ab3-4aa1-ae90-25dd58ab4964"
                    productId: "11111111-1111-1111-1111-111111111111"
                    expiryDate: "2026-12-31"
                    status: Active
                    deliveredQuantity: 50
                    reservedQuantity: 4
                    availableQuantity: 46
                    reservations:
                      - reservationId: "0b7c2d41-8e3f-4a6b-9c5d-2e4f6a8b0c12"
                        orderId: "66666666-6666-6666-6666-666666666666"
                        quantity: 4
                        reservedOn: "2026-11-25"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: Not enough stock or batch expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                insufficientStock:
                  value:
                    type: "https://shelfwise.local/errors/batch.insufficient_stock"
                    title: Insufficient stock
                    status: 422
                    detail: Cannot reserve 4 items. Only 0 available.
                    errorCode: batch.insufficient_stock
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    BatchIdPath:
      name: batchId
      in: path
      required: true
      description: Product batch identifier (UUID).
      schema:
        type: string
        format: uuid
      example: "5bf1405b-5ab3-4aa1-ae90-25dd58ab4964"

  schemas:
    RegisterBatchRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity, expiryDate]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        expiryDate:
          type: string
          format: date
          minLength: 10
          maxLength: 10
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Must be later than today (otherwise 400 batch.invalid_expiry_date).

    ReserveStockRequest:
      type: object
      additionalProperties: false
      required: [orderId, quantity]
      properties:
        orderId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    BatchDto:
      type: object
      required: [batchId, productId, expiryDate, status, deliveredQuantity, reservedQuantity, availableQuantity, reservations]
      properties:
        batchId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        expiryDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/BatchStatus'
        deliveredQuantity:
          type: integer
          minimum: 1
        reservedQuantity:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/StockReservationDto'

    StockReservationDto:
      type: object
      required: [reservationId, orderId, quantity, reservedOn]
      properties:
        reservationId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        reservedOn:
          type: string
          format: date

    BatchStatus:
      type: string
      enum: [Active, SoldOut, Expired, WrittenOff]

    ProblemDetails:
      type: object
      required: [type, title, status, errorCode]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        errorCode:
          type: string
          pattern: '^[a-z]+(\.[a-z_]+)+$'
          maxLength: 64

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidQuantity:
              value:
                type: "https://shelfwise.local/errors/batch.invalid_quantity"
                title: Invalid quantity
                status: 400
                detail: Quantity must be greater than zero.
                errorCode: batch.invalid_quantity
    NotFound:
      description: Batch not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              value:
                type: "https://shelfwise.local/errors/batch.not_found"
                title: Batch not found
                status: 404
                errorCode: batch.not_found
    IdempotencyConflict:
      description: Idempotency-Key reused with a different request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            conflict:
              value:
                type: "https://shelfwise.local/errors/request.idempotency_conflict"
                title: Idempotency conflict
                status: 409
                errorCode: request.idempotency_conflict
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unavailable:
              value:
                type: "https://shelfwise.local/errors/catalog.unavailable"
                title: Service unavailable
                status: 503
                errorCode: catalog.unavailable

  examples:
    ActiveBatch:
      value:
        batchId: "5bf1405b-5ab3-4aa1-ae90-25dd58ab4964"
        productId: "11111111-1111-1111-1111-111111111111"
        expiryDate: "2026-12-31"
        status: Active
        deliveredQuantity: 50
        reservedQuantity: 0
        availableQuantity: 50
        reservations: []
